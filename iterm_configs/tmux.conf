# ============================================
# tmux configuration file
# ============================================

# ----------------
# General Settings
# ----------------

# Set true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable mouse support
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set escape time to 0 for faster command sequences
set -sg escape-time 0

# Increase repeat timeout
set -sg repeat-time 600

# Focus events enabled for terminals that support them
set -g focus-events on

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# ----------------
# Key Bindings
# ----------------

# Change prefix from Ctrl-b to Ctrl-a (more comfortable)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Easy pane navigation with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with prefix + Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift+arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Toggle synchronize-panes
bind S set-window-option synchronize-panes\; display "Sync #{?pane_synchronized,ON,OFF}"

# Quick window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode with vi keybindings
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer

# Vi-like copy/paste bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# ----------------
# Status Bar
# ----------------

# Update status bar every 5 seconds
set -g status-interval 5

# Status bar position
set -g status-position bottom

# Status bar styling
set -g status-style bg=colour234,fg=colour137

# Left status bar: session name
set -g status-left-length 20
set -g status-left '#[fg=colour233,bg=colour245,bold] #S #[default] '

# Right status bar: hostname, time, date
set -g status-right-length 50
set -g status-right '#[fg=colour233,bg=colour241] %H:%M #[fg=colour233,bg=colour245] %Y-%m-%d '

# Window status formatting
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I:#W#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I:#W#F '

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Message styling
set -g message-style bg=colour235,fg=colour166,bold

# ----------------
# Additional Features
# ----------------

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on

# Enable clipboard integration (works with most terminals)
set -g set-clipboard on

# Don't exit from tmux when closing a session
set -g detach-on-destroy off

# Aggressive resize (useful when using grouped sessions)
setw -g aggressive-resize on